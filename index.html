            background-color: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 15px;
        }
        .search-section {
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #555;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #45a049;
        }
        .result-section {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            border-left: 4px solid #4CAF50;
            display: none;
        }
        .result-section h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .result-item {
            margin-bottom: 10px;
            padding: 10px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(0,0,0,0.05);
        }
        .empty-result {
            color: #ff5722;
            text-align: center;
            padding: 20px;
        }
        .section-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f5e9;
            border-radius: 5px;
        }
        .section-info h3 {
            color: #2e7d32;
            margin-bottom: 10px;
        }
        .statistics {
            margin-top: 30px;
            padding: 20px;
            background-color: #fff3e0;
            border-radius: 5px;
            border-left: 4px solid #ff9800;
        }
        .statistics h3 {
            color: #e65100;
            margin-bottom: 15px;
        }
        .stat-item {
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 14px;
        }
        .qr-code {
            text-align: center;
            margin: 20px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 5px;
        }
        .qr-code img {
            max-width: 200px;
            margin: 0 auto;
        }
        .deployment-note {
            margin-top: 20px;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 5px;
            border-left: 4px solid #2196f3;
        }
        .deployment-note h4 {
            color: #1565c0;
            margin-bottom: 10px;
        }
    </style>

        // DOM元素（仅保留单位查询相关）
        const searchBtn = document.getElementById('search-btn');
        const resultSection = document.getElementById('result-section');
        const resultContent = document.getElementById('result-content');
        
        // 搜索按钮点击事件（仅保留按单位查询逻辑）
        searchBtn.addEventListener('click', function() {
            resultContent.innerHTML = '';
            const unit = document.getElementById('unit-input').value.trim();
            
            if (!unit) {
                alert('请输入单位或姓名');
                return;
            }
            
            // 调用按单位查询函数
            searchByUnit(unit);
            resultSection.style.display = 'block';
        });
        
        // 按单位查询（保留原逻辑）
        function searchByUnit(unit) {
            const results = [];
            
            // 遍历所有区域查找匹配的单位
            Object.keys(seatingData).forEach(section => {
                const seats = seatingData[section];
                Object.keys(seats).forEach(seatNum => {
                    const seatUnit = seats[seatNum];
                    if (seatUnit && seatUnit.includes(unit)) {
                        results.push({
                            section: section,
                            seatNum: seatNum,
                            unit: seatUnit
                        });
                    }
                });
            });
            
            if (results.length === 0) {
                resultContent.innerHTML = '<div class="empty-result">未找到匹配的座位信息</div>';
                return;
            }
            
            let html = '<p>找到 ' + results.length + ' 个匹配的座位：</p>';
            
            results.forEach(result => {
                const status = result.unit === '空座' || result.unit.trim() === '' ? 'empty' : 'occupied';
                const statusColor = status === 'empty' ? '#ff9800' : '#4CAF50';
                
                html += '<div class="result-item" style="border-left: 4px solid ' + statusColor + ';">' +
                            '<div style="margin-bottom: 5px;">' +
                                '<strong>区域：' + result.section + '</strong>' +
                            '</div>' +
                            '<div style="display: flex; justify-content: space-between; margin-bottom: 5px;">' +
                                '<span>座位号：' + result.seatNum + '</span>' +
                                '<span style="color: ' + statusColor + '; font-weight: bold;">' + (status === 'empty' ? '空座' : '已占用') + '</span>' +
                            '</div>' +
                            '<div>单位/姓名：' + result.unit + '</div>' +
                        '</div>';
            });
            
            resultContent.innerHTML = html;
        }
        
        // 初始化（聚焦到单位输入框）
        window.onload = function() {
            document.getElementById('unit-input').focus();
        };
    </script>
