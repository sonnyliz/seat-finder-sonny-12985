<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>座位查询系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 15px;
        }
        .search-box {
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            margin-bottom: 10px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #45a049;
        }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
            background: #f9f9f9;
            display: none;
        }
        .result h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .empty {
            color: #ff5722;
            text-align: center;
            padding: 20px;
        }
        .seat-item {
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-left: 4px solid #4CAF50;
            border-radius: 5px;
        }
        .seat-empty {
            border-left-color: #ff9800;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>座位查询</h1>
        <div class="search-box">
            <input type="text" id="unitInput" placeholder="请输入单位/姓名（例如：中国银行、李鹏怡）">
            <button id="searchBtn">查询座位</button>
        </div>
        <div id="resultBox" class="result">
            <h2>查询结果</h2>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        // 后端API地址（和你启动的服务器端口一致）
        const API_URL = "https://gracefully-impeachable-glennis.ngrok-free.dev/api/search-seat";
        
        // 获取页面元素
        const searchBtn = document.getElementById("searchBtn");
        const unitInput = document.getElementById("unitInput");
        const resultBox = document.getElementById("resultBox");
        const resultContent = document.getElementById("resultContent");

        // 点击查询按钮触发
        searchBtn.addEventListener("click", async () => {
            // 清空之前的结果
            resultContent.innerHTML = "";
            // 获取输入的关键词
            const unit = unitInput.value.trim();

            // 校验输入
            if (!unit) {
                alert("请输入要查询的单位或姓名！");
                return;
            }

            try {
                // 调用后端API
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ unit: unit })
                });

                const data = await response.json();

                // 显示结果区域
                resultBox.style.display = "block";

                // 处理查询结果
                if (data.code === 0 && data.data.length > 0) {
                    let html = `<p>共找到 ${data.data.length} 个匹配结果：</p>`;
                    data.data.forEach(item => {
                        const isEmpty = item.status === "empty";
                        html += `
                            <div class="seat-item ${isEmpty ? 'seat-empty' : ''}">
                                <div><strong>区域：</strong>${item.section}</div>
                                <div><strong>座位号：</strong>${item.seatNum}</div>
                                <div><strong>单位/姓名：</strong>${item.unit}</div>
                                <div><strong>状态：</strong>${isEmpty ? '空座' : '已占用'}</div>
                            </div>
                        `;
                    });
                    resultContent.innerHTML = html;
                } else {
                    resultContent.innerHTML = '<div class="empty">未找到匹配的座位信息</div>';
                }
            } catch (error) {
                console.error("查询失败：", error);
                resultBox.style.display = "block";
                resultContent.innerHTML = '<div class="empty">查询出错！请检查后端服务器是否正常运行</div>';
            }
        });

        // 按回车键也能查询
        unitInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                searchBtn.click();
            }
        });
    </script>
</body>
</html>
